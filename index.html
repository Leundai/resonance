<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>resonance</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%238a7cff'/></svg>"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050510;
        color: #e8e8f0;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      #hud.hidden {
        opacity: 0;
      }
      #drop-hint {
        font-size: 14px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      #status {
        font-size: 12px;
        opacity: 0.5;
        min-height: 1em;
      }
      #progress-wrap {
        width: 280px;
        height: 3px;
        background: rgba(232, 232, 240, 0.12);
        border-radius: 2px;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #progress-wrap.visible {
        opacity: 1;
      }
      #progress-bar {
        height: 100%;
        width: 0%;
        background: rgba(178, 158, 255, 0.9);
        transition: width 0.15s ease;
      }
      #toast {
        position: fixed;
        left: 50%;
        top: 38%;
        transform: translateX(-50%);
        font-size: 20px;
        letter-spacing: 0.18em;
        text-align: center;
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
        text-shadow: 0 0 24px rgba(0, 0, 0, 0.8);
      }
      #toast.visible {
        opacity: 0.9;
      }
      #demo-btn {
        pointer-events: auto;
        background: rgba(178, 158, 255, 0.12);
        border: 1px solid rgba(178, 158, 255, 0.4);
        color: #e8e8f0;
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.14em;
        padding: 8px 18px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
      }
      #demo-btn:hover {
        background: rgba(178, 158, 255, 0.28);
      }
      #now-playing {
        position: fixed;
        left: 16px;
        bottom: 14px;
        font-size: 11px;
        letter-spacing: 0.12em;
        opacity: 0.45;
        pointer-events: none;
      }
      body.dragging::after {
        content: '';
        position: fixed;
        inset: 8px;
        border: 1px dashed rgba(232, 232, 240, 0.5);
        border-radius: 8px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="drop-hint">drop a song · O to open · L live system audio · M live input</div>
      <button id="demo-btn">▶ play demo — Adventures by A Himitsu</button>
      <div id="progress-wrap"><div id="progress-bar"></div></div>
      <div id="status"></div>
    </div>
    <div id="toast"></div>
    <div id="now-playing"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
